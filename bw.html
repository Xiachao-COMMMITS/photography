<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黑白展区 — GALLERY BRUTAL</title>
  <meta name="description" content="个人摄影展 · 展区二 黑白" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/zone.css" />
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">GALLERY<span class="dot">.</span>BRUTAL</a>
    <ul class="nav-menu">
      <li><a href="color.html" data-transition>彩色</a></li>
      <li><a href="bw.html" class="is-active">黑白</a></li>
      <li><a href="about.html" data-transition>关于</a></li>
    </ul>
  </nav>
  <main class="zone-page">
    <header class="zone-header">
      <div class="zone-header-top">
        <nav class="crumbs">
          <a href="index.html" data-transition>首页</a>
          <span class="sep">/</span>
          <span class="current">黑白</span>
        </nav>
        <span class="mono">ZONE 02 — MONOCHROME</span>
      </div>
      <div class="zone-title-row">
        <h1 class="zone-title"><small>展区 02 / ZONE 02</small>黑白</h1>
        <p class="zone-intro">黑白关乎结构与秩序。这一区收录单色作品，去掉了色彩的干扰，只剩下光影、线条与质感。</p>
      </div>
    </header>
    <div class="zone-tools">
      <span class="zone-count" id="zoneCount">—</span>
      <div class="zone-switch">
        <a href="color.html" data-transition>彩色</a>
        <a href="bw.html" class="is-active">黑白</a>
      </div>
    </div>
    <div class="photo-grid" id="photoGrid"></div>
    <div class="zone-foot">
      <a class="text-link" href="index.html" data-transition>← 返回首页</a>
      <a class="text-link" href="color.html" data-transition>前往彩色展区 →</a>
    </div>
  </main>
  <footer class="site-footer">
    <span>© 2026 GALLERY BRUTAL</span>
    <span>展区二 · 黑白</span>
    <a href="about.html" data-transition>关于展览</a>
  </footer>
  <script src="data/pieces.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      const pieces = getPiecesByGroup('b');
      document.getElementById('zoneCount').textContent = pieces.length + ' 幅作品 / ' + pieces.length + ' PIECES';
      const grid = document.getElementById('photoGrid');
      grid.innerHTML = pieces.map(function(p, i) {
        const eager = i < 3;
        return '<article class="photo-card reveal" style="transition-delay:' + (i % 3) * 0.06 + 's"><a class="photo-card-link" href="piece.html?id=' + p.id + '" data-transition><div class="photo-frame"><img data-src="' + p.thumb + '|' + p.jpg + '" alt="' + p.title + '" width="' + p.tw + '" height="' + p.th + '" ' + (eager ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"') + ' decoding="async" /></div><div class="photo-caption"><span class="photo-num">' + p.num + '</span><span class="photo-name">' + p.title + '</span><span class="photo-rule"></span></div></a></article>';
      }).join('');
      hydrateImages(grid);
      initScrollReveal();
    })();
  </script>
</body>
</html>
